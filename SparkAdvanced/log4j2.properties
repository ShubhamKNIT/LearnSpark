status = error
name = SparkLog4j2Config

# =============================
# Console Appender
# =============================
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# =============================
# Rolling File Appender
# =============================
appender.file.type = RollingFile
appender.file.name = file
appender.file.fileName = ${sys:spark.yarn.app.container.log.dir}/${sys:logfile.name}.log
appender.file.filePattern = ${sys:spark.yarn.app.container.log.dir}/${sys:logfile.name}-%i.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 500MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 2
appender.file.immediateFlush = true
appender.file.append = false

# =============================
# Root Logger
# =============================
rootLogger.level = warn
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = console

# =============================
# Application-specific Logger
# =============================
logger.guruLearningjournal.name = guru.learningjournal.spark.examples
logger.guruLearningjournal.level = info
logger.guruLearningjournal.additivity = false
logger.guruLearningjournal.appenderRefs = console, file
logger.guruLearningjournal.appenderRef.console.ref = console
logger.guruLearningjournal.appenderRef.file.ref = file

# =============================
# Spark/Hadoop Noise Reduction
# =============================
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.jetty.name = org.spark_project.jetty
logger.jetty.level = warn

logger.jettyLifeCycle.name = org.spark_project.jetty.util.component.AbstractLifeCycle
logger.jettyLifeCycle.level = error

logger.parquet1.name = org.apache.parquet
logger.parquet1.level = error

logger.parquet2.name = parquet
logger.parquet2.level = error

logger.retryingHMSHandler.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.retryingHMSHandler.level = fatal

logger.functionRegistry.name = org.apache.hadoop.hive.ql.exec.FunctionRegistry
logger.functionRegistry.level = error
