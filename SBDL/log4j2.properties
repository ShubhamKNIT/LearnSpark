status = warn
name = SparkKafkaLocalLogging

# ===============================
# Base Directory for Logs
# ===============================
property.baseDir = ${sys:user.dir}

# ===============================
# Console Appender (optional)
# ===============================
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5level [%t] %c{1} - %msg%n

# ===============================
# Rolling File Appender (INFO+)
# ===============================
appender.rolling.type = RollingFile
appender.rolling.name = FileAppender
appender.rolling.fileName = ${baseDir}/application.log
appender.rolling.filePattern = ${baseDir}/application-%d{yyyy-MM-dd}-%i.log.gz

appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level [%t] %c{1} - %msg%n

# Rolling policies — required by Log4j2
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB

# ===============================
# Rolling File Appender (ERROR only)
# ===============================
appender.error.type = RollingFile
appender.error.name = ErrorFileAppender
appender.error.fileName = ${baseDir}/error.log
appender.error.filePattern = ${baseDir}/error-%d{yyyy-MM-dd}-%i.log.gz

appender.error.layout.type = PatternLayout
appender.error.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level [%t] %c{1} - %msg%n

appender.error.policies.type = Policies
appender.error.policies.time.type = TimeBasedTriggeringPolicy
appender.error.policies.time.interval = 1
appender.error.policies.size.type = SizeBasedTriggeringPolicy
appender.error.policies.size.size = 5MB

# Only log ERROR+ to this appender
appender.error.filter.threshold.type = ThresholdFilter
appender.error.filter.threshold.level = error

# ===============================
# Root Logger
# ===============================
rootLogger.level = info
rootLogger.appenderRefs = rolling, error, console
rootLogger.appenderRef.rolling.ref = FileAppender
rootLogger.appenderRef.error.ref = ErrorFileAppender
rootLogger.appenderRef.console.ref = ConsoleAppender

# ===============================
# Reduce Spark Noise
# ===============================
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.sparkSql.name = org.apache.spark.sql
logger.sparkSql.level = warn

# ===============================
# Reduce Kafka Noise
# ===============================
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn
logger.kafkaClients.name = org.apache.kafka.clients
logger.kafkaClients.level = warn

# ===============================
# Application Logger
# ===============================
logger.application.name = com.yourcompany
logger.application.level = info
logger.application.additivity = false
logger.application.appenderRefs = rolling, error, console
logger.application.appenderRef.rolling.ref = FileAppender
logger.application.appenderRef.error.ref = ErrorFileAppender
logger.application.appenderRef.console.ref = ConsoleAppender
